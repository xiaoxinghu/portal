# SPDX-License-Identifier: GPL-3.0-or-later
# The checks in one job on one macOS runner, so the downloads and the build
# serve them all, and the checks that run on Linux in a job on each Linux CPU.
# Two tiers, as in CONTRIBUTING.md: a push to main runs the essential set; a
# run started by hand, as on a release candidate's branch, unless told
# otherwise, and any run on a release/ branch, run the full set, which adds the tests tagged :expensive
# and the package's first use in graphical Emacs, with its own second build.
# Not on pull requests.
# When every check of a job passed, it packs the build they tested as that
# system's runtime archive, checks it unpacked elsewhere and keeps it as an
# artifact, which on this public repository any signed-in GitHub user can
# download.
name: Checks

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cache:
        description: Restore cached downloads (off proves a cold build)
        type: boolean
        default: true
      full:
        description: Run the full set (off runs the essential set, as a push to main does)
        type: boolean
        default: true
      releases:
        description: >-
          Install the Linux runtimes from this release site, such as
          https://github.com/OWNER/REPO/releases/download/, not the run's own
          (run it on the release's commit)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    # macOS 27 arm64 with Xcode 27: the platform matrix's verified row.
    runs-on: xcode-27
    timeout-minutes: 60
    defaults:
      run:
        # Named explicitly, bash runs with pipefail.
        shell: bash
    env:
      # docs/testing.md's guest setup: the emacs-plus-app cask at this tap commit.
      EMACS_PLUS_TAP_COMMIT: 2d6afb2ec4869b8dc3098541696d0d9d362cc8f0
      EMACS: /Applications/Emacs.app/Contents/MacOS/Emacs
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ANALYTICS: 1
      USE_CACHE: ${{ github.event_name != 'workflow_dispatch' || inputs.cache }}
      # The full set's runs: every ERT runner includes the tests tagged
      # :expensive, and the package's first use runs. Empty on main's pushes.
      PORTAL_TEST_EXPENSIVE: ${{ ((github.event_name == 'workflow_dispatch' && inputs.full) || startsWith(github.ref_name, 'release/')) && '1' || '' }}
      # ERT says why each skipped test skipped, for a release's notes: those
      # are written from the logs alone, so every step that counts tests or
      # describes the machine writes its output there too.
      EMACS_TEST_VERBOSE: 1
      # The graphical suites' web views draw canvases in their own web
      # process, not WebKit's GPU process, which on this runner now and then
      # hangs making a canvas's buffer (docs/testing.md, "View graphical
      # checks"). The test module sets it; Portal itself does not.
      PORTAL_TEST_WEBKIT_FEATURES: UseGPUProcessForCanvasRenderingEnabled=0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record the environment
        id: env
        run: |
          # Fixed places, so that test/package-gui.sh's own build, with its
          # isolated HOME, reuses the Bun and host packages this build fetched.
          {
            echo "PORTAL_TEST_LOGS=$RUNNER_TEMP/logs"
            echo "PORTAL_TOOLS_DIR=$RUNNER_TEMP/portal-tools"
            echo "BUN_INSTALL_CACHE_DIR=$RUNNER_TEMP/bun-cache"
          } >>"$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/logs"
          echo "image=$ImageOS-$ImageVersion" >>"$GITHUB_OUTPUT"
          echo "brew-cache=$(brew --cache)" >>"$GITHUB_OUTPUT"
          {
            # Only a full run with USE_CACHE=false is a release's evidence.
            echo "USE_CACHE=$USE_CACHE"
            echo "PORTAL_TEST_EXPENSIVE=$PORTAL_TEST_EXPENSIVE"
            echo "PORTAL_TEST_WEBKIT_FEATURES=$PORTAL_TEST_WEBKIT_FEATURES"
            echo "Runner image $ImageOS $ImageVersion"
            sw_vers
            uname -m
            xcodebuild -version
            swift --version
            cmake --version | head -1
            echo "Ninja $(ninja --version)"
            brew --version
            # system_profiler lists no displays in the runner's VM; ask AppKit.
            osascript -l JavaScript -e 'ObjC.import("AppKit");
              const s = $.NSScreen.mainScreen, f = s.frame, v = s.visibleFrame;
              `Screen ${f.size.width}x${f.size.height}, visible ${v.size.width}x${v.size.height}, scale ${s.backingScaleFactor}`' || :
          } 2>&1 | tee "$RUNNER_TEMP/logs/environment.log"

      # Restore and save separately: a combined cache step saves only when
      # the whole job succeeds, so failing checks would never fill the cache.
      - name: Restore Homebrew downloads
        id: brew-cache
        if: env.USE_CACHE == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.env.outputs.brew-cache }}/downloads
          key: brew-${{ steps.env.outputs.image }}-${{ env.EMACS_PLUS_TAP_COMMIT }}

      - name: Install Emacs
        run: |
          brew tap d12frosted/emacs-plus
          brew trust d12frosted/emacs-plus
          git -C "$(brew --repository d12frosted/emacs-plus)" checkout -q "$EMACS_PLUS_TAP_COMMIT"
          brew install --cask emacs-plus-app
          # Gatekeeper would hold the first graphical launch of a downloaded app.
          xattr -dr com.apple.quarantine /Applications/Emacs.app
          # CLI launches miss the app's native compiler environment.
          echo "LIBRARY_PATH=$(/usr/libexec/PlistBuddy -c Print:LSEnvironment:LIBRARY_PATH \
              /Applications/Emacs.app/Contents/Info.plist)" >>"$GITHUB_ENV"
          "$EMACS" --batch -Q --eval '(princ (format "%s %s %s\n" (emacs-version)
              emacs-repository-version (native-comp-available-p)))' |
              tee -a "$PORTAL_TEST_LOGS/environment.log"

      - name: Save Homebrew downloads
        if: steps.brew-cache.outcome == 'success' && steps.brew-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.env.outputs.brew-cache }}/downloads
          key: ${{ steps.brew-cache.outputs.cache-primary-key }}

      - name: Restore Swift packages
        id: swift-cache
        if: env.USE_CACHE == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ steps.env.outputs.image }}-${{ hashFiles('native/Package.resolved', 'native/libghostty-spm.json') }}

      - name: Restore libghostty-spm test build
        id: libghostty-tests-cache
        if: env.USE_CACHE == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/libghostty-spm
            build/libghostty-spm-tests
          key: libghostty-spm-tests-${{ steps.env.outputs.image }}-${{ hashFiles('native/libghostty-spm.json', 'native/patches/libghostty-spm/*.patch', 'tools/patch-libghostty-spm.sh') }}

      - name: Restore Bun, host packages and Emacs packages
        id: build-cache
        if: env.USE_CACHE == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/portal-tools
            ${{ runner.temp }}/bun-cache
            build/elpa
          key: build-downloads-${{ hashFiles('tools/bun.manifest', 'host/bun.lock', 'CMakeLists.txt') }}

      - name: Build
        id: build
        run: |
          ./build.sh 2>&1 | tee "$PORTAL_TEST_LOGS/build.log"
          # The module must build against the header of the Emacs that loads it.
          header=$(cat build/emacs-include.txt)
          own=$("$EMACS" --batch -Q --eval '(princ (expand-file-name "../include" data-directory))')
          echo "emacs-module.h from $header" | tee -a "$PORTAL_TEST_LOGS/environment.log"
          [ "$(cd "$header" && pwd -P)" = "$(cd "$own" && pwd -P)" ] ||
              { echo "::error::Built against $header, not $EMACS's $own"; exit 1; }
          # Host scripts call bun by name.
          dirname "$(sh tools/resolve-bun.sh)" >>"$GITHUB_PATH"

      - name: Save Swift packages
        if: steps.swift-cache.outcome == 'success' && steps.swift-cache.outputs.cache-hit != 'true' && steps.build.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ steps.swift-cache.outputs.cache-primary-key }}

      - name: Save Bun, host packages and Emacs packages
        if: steps.build-cache.outcome == 'success' && steps.build-cache.outputs.cache-hit != 'true' && steps.build.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/portal-tools
            ${{ runner.temp }}/bun-cache
            build/elpa
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      - name: CTest
        id: ctest
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          # The suites' own output, which the job log shows only for a failure,
          # goes to the logs: a release's notes count and name skipped tests there.
          status=0
          ctest --test-dir build -j"$(sysctl -n hw.ncpu)" --output-on-failure || status=$?
          cp build/Testing/Temporary/LastTest.log "$PORTAL_TEST_LOGS/ctest.log" || :
          exit "$status"

      - name: Save libghostty-spm test build
        if: steps.libghostty-tests-cache.outcome == 'success' && steps.libghostty-tests-cache.outputs.cache-hit != 'true' && steps.ctest.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/libghostty-spm
            build/libghostty-spm-tests
          key: ${{ steps.libghostty-tests-cache.outputs.cache-primary-key }}

      - name: Biome
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: '"$(sh tools/resolve-bun.sh)" run --cwd host check'

      - name: TypeScript
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: '"$(sh tools/resolve-bun.sh)" run --cwd host typecheck'

      - name: Python
        if: ${{ !cancelled() }}
        # Verbose, so that a skipped test is named with its reason.
        run: python3 -B test/run-python-tests.py 2>&1 | tee "$PORTAL_TEST_LOGS/python.log"

      - name: Whitespace
        if: ${{ !cancelled() }}
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

      # Each suite logs to a directory of its own, its output in test.log as
      # test/gui-all.sh keeps it: the GUI runner starts its progress log
      # afresh, and a later suite must not erase a failure's.
      - name: Views (graphical)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          export PORTAL_TEST_LOGS=$PORTAL_TEST_LOGS/views
          mkdir -p "$PORTAL_TEST_LOGS"
          sh test/views-gui.sh 2>&1 | tee "$PORTAL_TEST_LOGS/test.log"

      - name: Input (graphical)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          export PORTAL_TEST_LOGS=$PORTAL_TEST_LOGS/input
          mkdir -p "$PORTAL_TEST_LOGS"
          sh test/input-gui.sh 2>&1 | tee "$PORTAL_TEST_LOGS/test.log"

      # The runtime's short check, on the checkout's build. Whether a runner
      # may capture Emacs's own window is the runner's: when it may not,
      # the test exits 77, which is a warning here, not a pass.
      - name: Rendering smoke (graphical)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          status=0
          sh test/render-smoke.sh || status=$?
          if [ "$status" = 77 ]; then
            echo "::warning::The rendering smoke test could not run on this runner; render-smoke.log says why"
            exit 0
          fi
          exit "$status"

      - name: Launcher (graphical)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          export PORTAL_TEST_LOGS=$PORTAL_TEST_LOGS/launcher
          mkdir -p "$PORTAL_TEST_LOGS"
          sh test/launcher-gui.sh 2>&1 | tee "$PORTAL_TEST_LOGS/test.log"

      - name: Terminal shell startup (graphical)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          export PORTAL_TEST_LOGS=$PORTAL_TEST_LOGS/terminal-shell-startup
          mkdir -p "$PORTAL_TEST_LOGS"
          sh test/terminal-shell-startup.sh 2>&1 | tee "$PORTAL_TEST_LOGS/test.log"

      # The full set only: a complete second build, about two minutes. A push
      # to main has installed the package (CTest package), offered the build
      # (CTest build), built (Build), and started the host and drawn a terminal
      # from the runtime unpacked elsewhere.
      - name: Package first use (graphical)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && env.PORTAL_TEST_EXPENSIVE == '1' }}
        run: |
          export PORTAL_TEST_LOGS=$PORTAL_TEST_LOGS/package
          mkdir -p "$PORTAL_TEST_LOGS"
          sh test/package-gui.sh 2>&1 | tee "$PORTAL_TEST_LOGS/test.log"

      # The runtime archive: the build every step above tested, tarred as it
      # is, never built again, so only after all of them passed. On a release
      # candidate's branch, release/vX.Y.Z, its manifest names the tag.
      - name: Pack the runtime
        id: runtime
        run: |
          tag=
          case $GITHUB_REF_NAME in release/v*) tag=${GITHUB_REF_NAME#release/} ;; esac
          mkdir -p "$PORTAL_TEST_LOGS/runtime"
          python3 -B scripts/runtime-archive.py pack ${tag:+--tag "$tag"} --commit "$GITHUB_SHA" \
              build "$RUNNER_TEMP/runtime" 2>&1 | tee "$PORTAL_TEST_LOGS/runtime/runtime.log"
          manifest=$(ls "$RUNNER_TEMP/runtime/"*.json)
          cp "$manifest" "$PORTAL_TEST_LOGS/runtime/"
          echo "manifest=$manifest" >>"$GITHUB_OUTPUT"
          echo "archive=${manifest%.json}.tar.gz" >>"$GITHUB_OUTPUT"

      # The archive unpacked into another directory, with the checkout's build
      # moved away so that nothing falls back on it: its files and binaries,
      # then its module loaded and host started by a disposable Emacs, then a
      # terminal drawn from it, which shows Ghostty's resources found there. The
      # suites are not run again on the same bytes. A smoke test that cannot
      # run here (77) fails this step: an archive nothing drew from is unchecked.
      - name: Check the unpacked runtime (graphical)
        env:
          MANIFEST: ${{ steps.runtime.outputs.manifest }}
        run: |
          export PORTAL_TEST_LOGS=$PORTAL_TEST_LOGS/runtime
          unpacked=$RUNNER_TEMP/unpacked/portal
          mv build "$RUNNER_TEMP/build-tested"
          trap 'mv "$RUNNER_TEMP/build-tested" build' EXIT
          python3 -B scripts/runtime-archive.py unpack "$MANIFEST" "$unpacked" 2>&1 | tee -a "$PORTAL_TEST_LOGS/runtime.log"
          "$EMACS" --batch -Q -l portal-build.el -f portal-build--probe-batch "$unpacked" 2>&1 |
              tee -a "$PORTAL_TEST_LOGS/runtime.log"
          sh test/render-smoke.sh "$unpacked"

      - name: Keep the runtime archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Unzipped, so the artifact is the archive itself, named as it is.
          path: ${{ steps.runtime.outputs.archive }}
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Keep the runtime manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.runtime.outputs.manifest }}
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Keep logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs
          path: ${{ runner.temp }}/logs
          retention-days: 14

  linux:
    # The two Linux runtime archives, one a CPU, equal in priority: Ubuntu
    # 26.04's glibc 2.43 is their floor, so each builds on the runner itself,
    # with its own GCC, CMake and GTK 3, Wayland and EGL packages, and needs no
    # container or sysroot. The runner lacks three things: Emacs 31.1 with
    # modules (Ubuntu packages 30.2), built here with pgtk and cached; Zig at
    # Ghostty's pin; and a target for Ghostty's library, which Zig would
    # otherwise build for the runner's CPU: here it is the floor's glibc and a
    # baseline CPU. The module is compiled for that CPU by name too, not with
    # GCC's defaults: the x86-64 image's GCC assumes x86-64-v3, and its glibc
    # is built for it, so Emacs is built in a stock Ubuntu container. No
    # graphical checks: Linux renders are not checked here, and there is no
    # app host on Linux.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            target: linux-x86_64-gnu
            ghostty-target: x86_64-linux-gnu.2.43
            march: x86-64
            zig: zig-x86_64-linux
            # ziglang.org/download/index.json, for the pin's Zig.
            zig-sha256: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
            # x86-64 as AMD64 first was, with SSE2 and no later extension.
            qemu: qemu-x86_64
            qemu-cpu: qemu64
          - runner: ubuntu-26.04-arm
            target: linux-aarch64-gnu
            ghostty-target: aarch64-linux-gnu.2.43
            march: armv8-a
            zig: zig-aarch64-linux
            zig-sha256: 9e8d11661d4ae3bd57702a3832781e23ad151dde5798e16a5ccd503f65234ff8
            # Armv8.0-A, with none of the later atomics, SVE or the like.
            qemu: qemu-aarch64
            qemu-cpu: cortex-a53
    name: linux (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      # GNU's release tarball, checked against its signature when pinned.
      EMACS_VERSION: '31.1'
      EMACS_SHA256: 1da5790d9580c81932b5bf700633114468da7b3412d69faa767daebf974f4586
      EMACS_CONFIGURE: >-
        --with-pgtk --with-modules --without-native-compilation
        --without-sound --without-mailutils --with-gnutls=ifavailable
        --with-xpm=ifavailable --with-jpeg=ifavailable --with-gif=ifavailable
        --with-tiff=ifavailable --with-png=ifavailable
      DEBIAN_FRONTEND: noninteractive
      # Stock Ubuntu 26.04, the archives' floor, where the runner's own image
      # is not: Emacs is built there, and the archive run there.
      UBUNTU_IMAGE: ubuntu:26.04
      USE_CACHE: ${{ github.event_name != 'workflow_dispatch' || inputs.cache }}
      PORTAL_TEST_EXPENSIVE: ${{ ((github.event_name == 'workflow_dispatch' && inputs.full) || startsWith(github.ref_name, 'release/')) && '1' || '' }}
      EMACS_TEST_VERBOSE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the build's packages
        run: |
          # Emacs's and Portal's development files, Ghostty's tic, Mesa's
          # EGL for the ghostty-fed suite, and QEMU's user-mode CPUs.
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
              ninja-build pkg-config libgtk-3-dev libwayland-dev wayland-protocols \
              libegl-dev libegl-mesa0 libgl1-mesa-dri ncurses-bin libncurses-dev \
              libgnutls28-dev qemu-user binutils

      - name: Record the environment
        id: env
        run: |
          {
            echo "PORTAL_TEST_LOGS=$RUNNER_TEMP/logs"
            echo "EMACS=$RUNNER_TEMP/emacs/bin/emacs"
            echo "EMACS_INCLUDE=$RUNNER_TEMP/emacs/include"
            echo "ZIG_GLOBAL_CACHE_DIR=$RUNNER_TEMP/zig-global"
          } >>"$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/logs"
          echo "image=$ImageOS-$ImageVersion" >>"$GITHUB_OUTPUT"
          echo "zig=$(sed -n 's/.*"zig": *"\([^"]*\)".*/\1/p' native/ghostty.json)" >>"$GITHUB_OUTPUT"
          echo "emacs=$(echo "$UBUNTU_IMAGE $EMACS_SHA256 $EMACS_CONFIGURE ${{ matrix.march }}" | sha256sum | cut -c1-16)" >>"$GITHUB_OUTPUT"
          {
            echo "USE_CACHE=$USE_CACHE"
            echo "PORTAL_TEST_EXPENSIVE=$PORTAL_TEST_EXPENSIVE"
            echo "Runner image $ImageOS $ImageVersion"
            grep PRETTY_NAME /etc/os-release
            uname -srm
            nproc
            ldd --version | head -1
            cc --version | head -1
            cmake --version | head -1
            echo "Ninja $(ninja --version)"
            for package in gtk+-3.0 wayland-client wayland-protocols egl; do
              echo "$package $(pkg-config --modversion "$package")"
            done
            qemu-x86_64 --version | head -1 || :
            python3 --version
          } 2>&1 | tee "$RUNNER_TEMP/logs/environment.log"

      # Restore and save separately, as on the Mac: a combined cache step
      # saves only when the whole job succeeds.
      - name: Restore Emacs
        id: emacs-cache
        if: env.USE_CACHE == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/emacs
          key: emacs-${{ env.EMACS_VERSION }}-${{ steps.env.outputs.image }}-${{ runner.arch }}-${{ steps.env.outputs.emacs }}

      # Built on stock Ubuntu 26.04, in a container, for the CPU's baseline:
      # it is the Emacs that runs the archive on an emulated baseline CPU
      # too, and an executable the runner links takes its glibc's start
      # file, which the x86-64 image marks as needing x86-64-v3.
      - name: Build Emacs
        if: steps.emacs-cache.outputs.cache-hit != 'true'
        env:
          MARCH: ${{ matrix.march }}
        run: |
          docker run --rm -v "$RUNNER_TEMP:$RUNNER_TEMP" -e RUNNER_TEMP -e MARCH \
              -e EMACS_VERSION -e EMACS_SHA256 -e EMACS_CONFIGURE -e PORTAL_TEST_LOGS \
              "$UBUNTU_IMAGE" bash -euo pipefail -c '
            export DEBIAN_FRONTEND=noninteractive
            log=$PORTAL_TEST_LOGS/emacs-build.log
            apt-get update -q >/dev/null
            apt-get install -y -q --no-install-recommends build-essential pkg-config curl \
                ca-certificates xz-utils libgtk-3-dev libgnutls28-dev libncurses-dev >/dev/null
            gcc -Q --help=target | grep -E "^ +-march=" >"$log"
            source=$RUNNER_TEMP/emacs-source
            mkdir -p "$source"
            curl -fsSL --retry 3 -o "$source.tar.xz" \
                "https://ftpmirror.gnu.org/gnu/emacs/emacs-$EMACS_VERSION.tar.xz"
            echo "$EMACS_SHA256  $source.tar.xz" | sha256sum -c -
            tar -xJf "$source.tar.xz" -C "$source" --strip-components=1
            cd "$source"
            # The options are words.
            ./configure -q --prefix="$RUNNER_TEMP/emacs" $EMACS_CONFIGURE \
                CFLAGS="-O2 -g -march=$MARCH" >>"$log" 2>&1 || { tail -50 "$log"; exit 1; }
            make -j"$(nproc)" >>"$log" 2>&1 || { tail -50 "$log"; exit 1; }
            make install >>"$log" 2>&1
          '
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/emacs" "$PORTAL_TEST_LOGS"
          readelf --notes "$RUNNER_TEMP/emacs/bin/emacs" | grep -E 'x86 ISA|feature' || :

      - name: Save Emacs
        if: steps.emacs-cache.outcome == 'success' && steps.emacs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/emacs
          key: ${{ steps.emacs-cache.outputs.cache-primary-key }}

      - name: Check Emacs
        run: |
          "$EMACS" --batch -Q --eval '(princ (format "%s\n%s\n" (emacs-version)
              system-configuration-features))' | tee -a "$PORTAL_TEST_LOGS/environment.log"
          "$EMACS" --batch -Q --eval '(unless (and (equal emacs-version "'"$EMACS_VERSION"'")
              (fboundp (quote module-load))
              (string-match-p "\\_<PGTK\\_>" system-configuration-features))
            (kill-emacs 1))'

      - name: Restore Zig and Ghostty's packages
        id: zig-cache
        if: env.USE_CACHE == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/zig.tar.xz
            ${{ runner.temp }}/zig-global/p
          key: zig-${{ steps.env.outputs.zig }}-${{ runner.arch }}-${{ hashFiles('native/ghostty.json') }}

      - name: Install Zig
        env:
          ZIG_TARBALL: ${{ matrix.zig }}-${{ steps.env.outputs.zig }}
          ZIG_SHA256: ${{ matrix.zig-sha256 }}
        run: |
          # Ghostty's pin names the Zig; the digest here is that release's.
          [ -f "$RUNNER_TEMP/zig.tar.xz" ] ||
              curl -fsSL --retry 3 -o "$RUNNER_TEMP/zig.tar.xz" \
                  "https://ziglang.org/download/${{ steps.env.outputs.zig }}/$ZIG_TARBALL.tar.xz"
          echo "$ZIG_SHA256  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "ZIG=$RUNNER_TEMP/zig/zig" >>"$GITHUB_ENV"
          echo "Zig $("$RUNNER_TEMP/zig/zig" version)" | tee -a "$PORTAL_TEST_LOGS/environment.log"

      - name: Restore Emacs packages
        id: build-cache
        if: env.USE_CACHE == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/elpa
          key: linux-elpa-${{ hashFiles('CMakeLists.txt') }}

      - name: Build
        id: build
        run: |
          ./build.sh -DPORTAL_GHOSTTY_TARGET=${{ matrix.ghostty-target }} -DPORTAL_GHOSTTY_CPU=baseline \
              "-DCMAKE_C_FLAGS=-march=${{ matrix.march }}" 2>&1 | tee "$PORTAL_TEST_LOGS/build.log"
          # The module must build against the header of the Emacs that loads it.
          header=$(sed -n 's/^EMACS_INCLUDE:PATH=//p' build/CMakeCache.txt)
          echo "emacs-module.h from $header" | tee -a "$PORTAL_TEST_LOGS/environment.log"
          [ "$header" = "$EMACS_INCLUDE" ] ||
              { echo "::error::Built against $header, not $EMACS's $EMACS_INCLUDE"; exit 1; }

      - name: Save Zig and Ghostty's packages
        if: steps.zig-cache.outcome == 'success' && steps.zig-cache.outputs.cache-hit != 'true' && steps.build.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/zig.tar.xz
            ${{ runner.temp }}/zig-global/p
          key: ${{ steps.zig-cache.outputs.cache-primary-key }}

      - name: CTest
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          status=0
          ctest --test-dir build -j"$(nproc)" --output-on-failure || status=$?
          cp build/Testing/Temporary/LastTest.log "$PORTAL_TEST_LOGS/ctest.log" || :
          exit "$status"

      - name: Save Emacs packages
        if: steps.build-cache.outcome == 'success' && steps.build-cache.outputs.cache-hit != 'true' && steps.build.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/elpa
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      - name: Python
        if: ${{ !cancelled() }}
        run: python3 -B test/run-python-tests.py 2>&1 | tee "$PORTAL_TEST_LOGS/python.log"

      # The runtime archive: the build the steps above tested, tarred as it
      # is, only after all of them passed, as on the Mac.
      - name: Pack the runtime
        id: runtime
        run: |
          tag=
          case $GITHUB_REF_NAME in release/v*) tag=${GITHUB_REF_NAME#release/} ;; esac
          mkdir -p "$PORTAL_TEST_LOGS/runtime"
          python3 -B scripts/runtime-archive.py pack --target ${{ matrix.target }} \
              ${tag:+--tag "$tag"} --commit "$GITHUB_SHA" \
              build "$RUNNER_TEMP/runtime" 2>&1 | tee "$PORTAL_TEST_LOGS/runtime/runtime.log"
          manifest=$(ls "$RUNNER_TEMP/runtime/"*.json)
          cp "$manifest" "$PORTAL_TEST_LOGS/runtime/"
          echo "manifest=$manifest" >>"$GITHUB_OUTPUT"
          echo "archive=${manifest%.json}.tar.gz" >>"$GITHUB_OUTPUT"

      # The archive unpacked elsewhere, with the checkout's build moved away:
      # its files, and each binary's machine, libraries, symbol versions and
      # runpath, the loader asked where it finds them; then the module loaded
      # and Ghostty started from there by a disposable Emacs. The ABI
      # evidence, readelf's own, goes to the logs.
      - name: Check the unpacked runtime
        env:
          MANIFEST: ${{ steps.runtime.outputs.manifest }}
        run: |
          export PORTAL_TEST_LOGS=$PORTAL_TEST_LOGS/runtime
          unpacked=$RUNNER_TEMP/unpacked/portal
          mv build "$RUNNER_TEMP/build-tested"
          trap 'mv "$RUNNER_TEMP/build-tested" build' EXIT
          python3 -B scripts/runtime-archive.py unpack "$MANIFEST" "$unpacked" 2>&1 |
              tee -a "$PORTAL_TEST_LOGS/runtime.log"
          for binary in portal.so ghostty-linux/lib/ghostty-internal.so; do
            {
              echo "== $binary"
              sha256sum "$unpacked/$binary"
              readelf --file-header "$unpacked/$binary" | grep -E 'Class|Machine|Type'
              readelf --dynamic "$unpacked/$binary" | grep -E 'NEEDED|SONAME|RPATH|RUNPATH'
              readelf --notes "$unpacked/$binary" | grep -E 'x86 ISA|feature' || :
              readelf --version-info "$unpacked/$binary" | sed -n '/Version needs/,$p'
              ldd "$unpacked/$binary"
            } >>"$PORTAL_TEST_LOGS/abi.log" 2>&1
          done
          {
            # The runner's own system may be built for a newer CPU than its
            # distribution's: what it and GCC assume, for the record.
            echo "== the builder"
            dpkg-query -W -f '${Package} ${Version} ${Architecture}\n' libc6
            gcc -Q --help=target | grep -E '^ +-march=|^ +-mcpu='
          } >>"$PORTAL_TEST_LOGS/abi.log" 2>&1
          "$EMACS" --batch -Q -l portal-build.el -f portal-build--probe-batch "$unpacked" \
              --eval '(princ (format "Ghostty: %S\n" (portal--terminal-engine)))' 2>&1 |
              tee -a "$PORTAL_TEST_LOGS/runtime.log"

      # The same bits on Ubuntu 26.04 as its archive installs it, in a
      # container, and then on an emulated CPU of the archive's baseline,
      # where an instruction beyond it stops Emacs. Not on the runner's own
      # system: the x86-64 image's glibc is built for x86-64-v3, and its
      # loader stops on a CPU older than Haswell before any program starts.
      # First a program of one newer instruction, which the runner's CPU
      # has: the emulated CPU must refuse it. It needs no C library.
      - name: Run the unpacked runtime on the floor's system and baseline CPU
        env:
          QEMU: ${{ matrix.qemu }}
          QEMU_CPU: ${{ matrix.qemu-cpu }}
        run: |
          export PORTAL_TEST_LOGS=$PORTAL_TEST_LOGS/runtime
          unpacked=$RUNNER_TEMP/unpacked/portal
          mv build "$RUNNER_TEMP/build-tested"
          trap 'mv "$RUNNER_TEMP/build-tested" build' EXIT
          cat >"$RUNNER_TEMP/newer.c" <<'EOF'
          void _start(void)
          {
          #if defined(__x86_64__)
              __asm__ volatile("vpxor %%ymm0, %%ymm0, %%ymm0" ::: "xmm0");
              __asm__ volatile("mov $60, %%eax\n\txor %%edi, %%edi\n\tsyscall" ::: "memory");
          #else
              static int word;
              int old;
              __asm__ volatile(".arch armv8.1-a\n\tldadd %w1, %w0, [%2]"
                               : "=r"(old) : "r"(1), "r"(&word) : "memory");
              __asm__ volatile("mov x8, #93\n\tmov x0, #0\n\tsvc #0" ::: "memory");
          #endif
              for (;;) {
              }
          }
          EOF
          cc -O1 -static -nostdlib -o "$RUNNER_TEMP/newer" "$RUNNER_TEMP/newer.c"
          "$RUNNER_TEMP/newer"
          docker pull -q "$UBUNTU_IMAGE"
          docker image inspect --format 'Image {{index .RepoDigests 0}}' "$UBUNTU_IMAGE" |
              tee -a "$PORTAL_TEST_LOGS/runtime.log"
          # Emacs's libraries come from Ubuntu's pgtk Emacs, as a user's would.
          docker run --rm -v "$RUNNER_TEMP:$RUNNER_TEMP" -v "$PWD:$PWD" -w "$PWD" \
              -e EMACS -e QEMU -e QEMU_CPU -e unpacked="$unpacked" -e newer="$RUNNER_TEMP/newer" \
              "$UBUNTU_IMAGE" bash -euo pipefail -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -q >/dev/null
            apt-get install -y -q --no-install-recommends emacs-pgtk libegl1 libegl-mesa0 \
                qemu-user >/dev/null
            grep PRETTY_NAME /etc/os-release
            dpkg-query -W -f "\${Package} \${Version} \${Architecture}\n" libc6
            status=0
            "$QEMU" -cpu "$QEMU_CPU" "$newer" || status=$?
            if [ "$status" != 132 ]; then
              echo "::error::The emulated $QEMU_CPU did not refuse a newer instruction: $status"
              exit 1
            fi
            echo "The emulated $QEMU_CPU refuses an instruction beyond the baseline"
            emacs=$(readlink -f "$EMACS")
            probe=(--batch -Q -l portal-build.el -f portal-build--probe-batch "$unpacked"
                   --eval "(princ (format \"Ghostty: %S\n\" (portal--terminal-engine)))")
            echo "On this system:"
            "$emacs" "${probe[@]}"
            echo "On an emulated $QEMU_CPU:"
            "$QEMU" -cpu "$QEMU_CPU" /bin/true
            "$QEMU" -cpu "$QEMU_CPU" "$emacs" "${probe[@]}"
          ' 2>&1 | tee -a "$PORTAL_TEST_LOGS/runtime.log"
          {
            echo "### ${{ matrix.target }}"
            echo '```'
            cat "$PORTAL_TEST_LOGS/runtime.log"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      # The archive installed as a user's Emacs installs it, as far as a
      # batch Emacs goes: on stock Ubuntu 26.04 without Portal's build tools,
      # in a fresh home, with the checkout's Lisp and its build moved away,
      # portal-runtime.el fetches the manifest and the archive by the
      # release's tag over HTTPS, checks the size and SHA-256, unpacks it,
      # loads the module and starts Ghostty in a disposable Emacs and
      # activates it. Then a fresh Emacs finds it as Portal's commands do,
      # loads it and starts Ghostty, and an install again with no release
      # site to reach uses it. The run's own files are served under the
      # release's names from 127.0.0.1, signed by a test authority; with
      # the input releases, a release site's are fetched instead.
      - name: Install the runtime as a user would
        env:
          MANIFEST: ${{ steps.runtime.outputs.manifest }}
          RELEASES: ${{ github.event_name == 'workflow_dispatch' && inputs.releases || '' }}
        run: |
          export PORTAL_TEST_LOGS=$PORTAL_TEST_LOGS/runtime
          server=
          mv build "$RUNNER_TEMP/build-tested"
          trap 'mv "$RUNNER_TEMP/build-tested" build; [ -z "$server" ] || kill "$server"' EXIT
          tag=v$(sed -n 's/^;; Version: //p' portal.el)
          trust=
          if [ -z "$RELEASES" ]; then
            certs=$RUNNER_TEMP/release-certs site=$RUNNER_TEMP/release-site
            python3 -B test/runtime-assets.py certs "$certs"
            mkdir -p "$site/$tag"
            # A release's names: a push's manifest names no tag.
            python3 -I - "$MANIFEST" "$site/$tag" "$tag" ${{ matrix.target }} <<'EOF'
          import json, shutil, sys
          from pathlib import Path
          manifest, out, tag, target = Path(sys.argv[1]), Path(sys.argv[2]), *sys.argv[3:]
          data = json.loads(manifest.read_text())
          [archive] = data["archives"]
          name = f"portal-runtime-{tag}-{target}"
          shutil.copy(manifest.parent / archive["name"], out / f"{name}.tar.gz")
          data["tag"], archive["name"] = tag, f"{name}.tar.gz"
          (out / f"{name}.json").write_text(json.dumps(data))
          EOF
            python3 -B test/runtime-assets.py serve "$certs" trusted "$site" >"$RUNNER_TEMP/site.log" &
            server=$!
            port=
            for _ in $(seq 50); do
              port=$(sed -n 's/^{"port": \([0-9]*\)}$/\1/p' "$RUNNER_TEMP/site.log")
              [ -z "$port" ] || break
              sleep 0.2
            done
            [ -n "$port" ] || { echo "::error::The release site did not start"; exit 1; }
            RELEASES=https://127.0.0.1:$port/ trust=$certs/ca.pem
          fi
          docker run --rm --network host -v "$RUNNER_TEMP:$RUNNER_TEMP" -v "$PWD:$PWD" -w "$PWD" \
              -e EMACS -e RELEASES -e trust="$trust" -e HOME="$RUNNER_TEMP/user" \
              "$UBUNTU_IMAGE" bash -euo pipefail -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -q >/dev/null
            apt-get install -y -q --no-install-recommends emacs-pgtk libegl1 libegl-mesa0 \
                ca-certificates >/dev/null
            grep PRETTY_NAME /etc/os-release
            for tool in cmake ninja zig; do
              if command -v "$tool"; then echo "::error::$tool is installed"; exit 1; fi
            done
            echo "No cmake, ninja or zig; HOME $HOME, empty: $(ls -A "$HOME" 2>/dev/null | wc -l) entries"
            emacs=$(readlink -f "$EMACS")
            cache=$HOME/.emacs.d/portal/runtime/
            install() {
              "$emacs" --batch -Q -l portal-build.el -l portal-runtime.el \
                  -f portal-runtime--install-batch \
                  "(:directory \"$cache\" :releases \"$1\"${trust:+ :trustfiles (\"$trust\")})"
            }
            echo "Installing from $RELEASES:"
            install "$RELEASES"
            echo "A fresh Emacs uses it:"
            "$emacs" --batch -Q -L . --eval "(progn
                (setq portal-runtime-directory \"$cache\")
                (require (quote portal-build))
                (portal-build-ensure)
                (princ (format \"Runtime: %s\n\" portal-build--runtime))
                (module-load (portal-build-native-file portal-build--module))
                (princ (format \"Ghostty: %S\n\" (portal--terminal-engine))))"
            echo "Installing again with no release site to reach:"
            install https://127.0.0.1:9/
          ' 2>&1 | tee "$PORTAL_TEST_LOGS/install.log"
          {
            echo "### ${{ matrix.target }}: installed as a user would"
            echo '```'
            cat "$PORTAL_TEST_LOGS/install.log"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Keep the runtime archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.runtime.outputs.archive }}
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Keep the runtime manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.runtime.outputs.manifest }}
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Keep logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-${{ matrix.target }}
          path: ${{ runner.temp }}/logs
          retention-days: 14
