<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Slides</title>
		<style>
		html,
		body {
			width: 100%;
			height: 100%;
			margin: 0;
			overflow: hidden;
			background: #000;
			cursor: none;
		}
		#slide {
			display: block;
			width: 100%;
			height: 100%;
			object-fit: contain;
		}
		#slide:not([src]) {
			visibility: hidden;
		}
		</style>
		<script type="module" src="./audience.js"></script>
	</head>
	<body>
		<img id="slide" alt="">
	</body>
</html>
